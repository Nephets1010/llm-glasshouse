# LLM 玻璃房价格表（契约 PRC-001）
#
# ★ 数据来源与核对要求（架构 Q-B）：
#   每条价格必须标注 source 与 effectiveFrom，并写明最后核对日期。
#   OFFICIAL 条目必须来自供应商官方价目页；禁止在代码里编造价格。
#   ESTIMATED 条目来自社区估算，UI 与 CLI 必须显式标注为估算值。
#
# ★ 热更新：本文件变更后无需改代码、无需重启。生产环境可把本文件挂载到外部路径，
#   通过 `llm.glasshouse.prices-location` 指向该文件，由 PricingTableLoader 定时 reload。
#
# ★ 单位：inputPricePerUnit / outputPricePerUnit 均为「元（CNY）/ 1000 token」。
#   currency 固定 CNY（三仓统一内部核算基准）。
#
# ★ 最后核对日期：2026-10-09
#   核对范围：OpenAI / Anthropic / 通义 / 智谱 / DeepSeek / Kimi / 豆包 官方价目页
#   核对人：llm-glasshouse maintainers
#
#   ⚠️ 价格会变。本表是「快照」，不是「真理」。请在每次调价后更新本文件并提 PR。


# 中国大陆 PII 正则库
#
# ★ 脱敏是安全兜底，默认开启（RedactionPolicy.DEFAULT.enabled = true）。
# ★ 本文件不存在或格式错误时，PayloadRedactor 会自动回退到代码内置规则（PayloadRedactor.builtinPatterns()），
#   脱敏能力不会因为配置问题而失效。
# ★ 修改本文件无需改代码：PayloadRedactor.fromClasspath() 会在构造时读取。
#
# 正则语法：Java 正则（java.util.regex）。命名分组语法 (?<name>...) 不建议使用，
#   因为部分自定义规则会在拼接时产生歧义；保持使用普通分组与前后瞻。
#
# 规则名必须与 PayloadRedactor 中的常量一致：
#   mobile / idCard / bankCard / email / ipv4 / address
#
# 最后核对日期：2026-10-09

patterns:
  # 大陆手机号：可选 +86 前缀，1[3-9] 开头的 11 位号码
  mobile: '(?<![0-9])(?:\+?86[- ]?)?1[3-9][0-9]{9}(?![0-9])'

  # 18 位居民身份证（含末位 X）
  idCard: '(?<![0-9Xx])[1-9][0-9]{5}(?:19|20)[0-9]{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12][0-9]|3[01])[0-9]{3}[0-9Xx](?![0-9Xx])'

  # 银行卡：16~19 位数字，允许空格/短横线分组
  bankCard: '(?<![0-9])(?:[0-9]{4}[- ]){3,4}[0-9]{4}|(?<![0-9])[0-9]{16,19}(?![0-9])'

  # 邮箱
  email: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'

  # IPv4
  ipv4: '(?<![0-9])(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}(?![0-9])'

  # 详细地址：省级前缀 + 路/街/道/巷/弄/村/镇 + 门牌号
  address: '(?:北京|上海|天津|重庆|河北|山西|辽宁|吉林|黑龙江|江苏|浙江|安徽|福建|江西|山东|河南|湖北|湖南|广东|广西|海南|四川|贵州|云南|陕西|甘肃|青海|台湾|内蒙古|西藏|宁夏|新疆)(?:省|市|自治区)?[^，。；\s]{0,20}?(?:路|街|道|巷|弄|村|镇)\s*[^，。；\s]{0,30}号'
